name: Publish

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/publish.yml"
      - "scripts/**"
      - "package*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-package-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        run: node -p '"matrix=" + JSON.stringify(require("./scripts/release-targets.json"))' >> "$GITHUB_OUTPUT"

  prebuilds:
    name: Prebuilt — ${{ matrix.target }}
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}

      - name: Build native addon from the matching engine release
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = "$TARGET"
          npm ci --ignore-scripts
          node scripts/download.js --source-only
          npm run build
          mkdir -p "prebuilds/$TARGET"
          cp build/Release/doltlite.node "prebuilds/$TARGET/doltlite.node"

      - name: Install CLI dependencies (Linux)
        if: matrix.cli != '' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Build the matching Unix CLI
        if: matrix.cli != '' && runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          CLI: ${{ matrix.cli }}
        run: bash scripts/build-cli.sh "$TARGET" "$CLI"

      - name: Install CLI dependencies (Windows)
        if: matrix.cli != '' && runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib make tcl

      - name: Build the matching Windows CLI
        if: matrix.cli != '' && runner.os == 'Windows'
        shell: msys2 {0}
        env:
          TARGET: ${{ matrix.target }}
          CLI: ${{ matrix.cli }}
        run: bash scripts/build-cli.sh "$TARGET" "$CLI"

      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.target }}
          path: prebuilds/
          if-no-files-found: error
          retention-days: 7

  pack:
    name: Pack npm release candidate
    needs: prebuilds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          path: prebuilds/
          merge-multiple: true

      - name: Pack once
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          chmod 755 prebuilds/linux-x64/doltlite prebuilds/darwin-arm64/doltlite
          mkdir dist
          npm pack --ignore-scripts --pack-destination dist

      - uses: actions/upload-artifact@v4
        with:
          name: npm-candidate
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Install candidate — ${{ matrix.target }}
    needs: [targets, pack]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate
          path: dist/

      - name: Run a fresh npm consumer in Node.js and Bun
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = "$TARGET"
          npm run test:package -- "$PWD"/dist/*.tgz --bun

  source-fallback:
    name: Install candidate from source
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate
          path: dist/

      - name: Exercise the published install script without a prebuild
        run: npm run test:package -- "$PWD"/dist/*.tgz --source

  publish:
    name: Publish tested tarball
    needs: [verify, source-fallback]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@dolthub"

      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate
          path: dist/

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tarballs=("$PWD"/dist/*.tgz)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          version=$(node -p 'require("./package.json").version')
          spec="@dolthub/doltlite@$version"
          expected=$(node -e 'const fs=require("node:fs"), crypto=require("node:crypto"); console.log("sha512-"+crypto.createHash("sha512").update(fs.readFileSync(process.argv[1])).digest("base64"))' "$tarball")
          if ! npm publish "$tarball" --access public; then
            test "$(npm view "$spec" dist.integrity)" = "$expected"
          fi
          echo "TARBALL_INTEGRITY=$expected" >> "$GITHUB_ENV"
          echo "PACKAGE_SPEC=$spec" >> "$GITHUB_ENV"

      - name: Verify the public package and run a fresh consumer
        env:
          npm_config_fetch_retries: "0"
        run: |
          for _ in {1..12}; do
            integrity=$(npm view "$PACKAGE_SPEC" dist.integrity --prefer-online 2>/dev/null || true)
            if [[ -n "$integrity" ]]; then
              test "$integrity" = "$TARBALL_INTEGRITY"
              break
            fi
            sleep 5
          done
          test "$integrity" = "$TARBALL_INTEGRITY"
          npm run test:package -- "$PACKAGE_SPEC"

      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          path: prebuilds/
          merge-multiple: true

      - name: Stage release assets
        run: |
          mkdir -p release-assets
          for dir in prebuilds/*/; do
            platform=$(basename "$dir")
            cp "${dir}doltlite.node" "release-assets/doltlite-${platform}.node"
            if [ -f "${dir}doltlite" ]; then
              cp "${dir}doltlite" "release-assets/doltlite-${platform}"
            fi
            if [ -f "${dir}doltlite.exe" ]; then
              cp "${dir}doltlite.exe" "release-assets/doltlite-${platform}.exe"
            fi
          done

      - name: Create GitHub Release and attach prebuilds
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
